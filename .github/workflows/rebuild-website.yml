name: Rebuild website

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release-notification
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch website rebuild
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure WEBSITE_DISPATCH_TOKEN for the website repository'; exit 1; }
          gh api --method POST repos/OscarArranz/sol-studio-website/dispatches \
            -f event_type=sol-studio-release
